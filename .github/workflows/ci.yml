name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, unitarias, build y tamaño
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias + cobertura
        run: npm run test:coverage

      - name: Build (librería + tipos)
        run: npm run build

      - name: Tamaño (gzip)
        run: npm run size

      - name: La API pública coincide con api/nexus-tours.api.md
        run: npm run api:check

      - name: Build del sitio, referencia de API (TypeDoc) y demo
        run: npm run build:site && npm run docs:api && npm run build:demo

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage
          retention-days: 7

      - name: Subir sitio con referencia de API
        uses: actions/upload-artifact@v7
        with:
          name: sitio
          path: site-dist
          retention-days: 7

      - name: Subir demo
        uses: actions/upload-artifact@v7
        with:
          name: demo-portafolio
          path: demo-dist

  tamano:
    name: Tamaño vs rama base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: .base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Compilar la rama base
        working-directory: .base
        run: npm ci && npm run build
      - name: Compilar este PR
        run: npm ci && npm run build
      - name: Comparar (tabla en el resumen del job)
        run: node scripts/tamano.mjs --base .base

  paquete:
    name: Paquete publicado (tipos, Node, Vite, webpack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Are The Types Wrong + proyectos de prueba
        run: npm run check:paquete

  e2e:
    name: E2E (${{ matrix.navegador }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build (CDN y demo los necesitan)
        run: npm run build && npm run build:demo

      - name: Instalar ${{ matrix.navegador }}
        run: npx playwright install --with-deps ${{ matrix.navegador }}

      - name: Pruebas de punta a punta
        run: npx playwright test --project=${{ matrix.navegador }}

      - name: Subir reporte
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-${{ matrix.navegador }}
          path: |
            playwright-report
            test-results
          retention-days: 7
